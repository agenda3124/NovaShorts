name: Build NovaShorts Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile engine.py engine_v112.py bridge.py features.py main_v18.py main_v19.py main_v112.py main_v113.py
          python -c "import main_v113, engine_v112; assert len(engine_v112.PLATFORMS)==7; print('import-ok', list(engine_v112.PLATFORMS))"

      - name: UI construction smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication,QFrame; import main_v113; app=QApplication([]); w=main_v113.Nova(); assert w.pages.count()==8; assert len(w.home_checks)==7; assert hasattr(w,'quick_link'); assert w.quick_ocr.text()=='ON'; assert w.quick_cut.text()=='ON'; assert w.quick_wm.text() in ('ON','OFF'); assert w.quick_link.text() in ('ON','OFF'); assert w.findChild(QFrame,'heroV112') is None; assert w.width()>=1260; print('ui-ok',w.windowTitle(),w.quick_ocr.text(),w.quick_cut.text()); w.close()"

      - name: Install FFmpeg and Tesseract
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          choco install tesseract --yes --no-progress

      - name: Locate runtime tools
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\tools\\'} | Select-Object -First 1
          $ffprobe = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter ffprobe.exe -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\tools\\'} | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found' }
          if (-not $ffprobe) { throw 'ffprobe.exe not found' }
          Copy-Item $ffmpeg.FullName '.\ffmpeg.exe' -Force
          Copy-Item $ffprobe.FullName '.\ffprobe.exe' -Force

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name NovaShorts --collect-all edge_tts --collect-all yt_dlp --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all PySide6.QtSvg --hidden-import googleapiclient.discovery --hidden-import googleapiclient.http --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets --hidden-import PySide6.QtNetwork --hidden-import PySide6.QtSvg main_v113.py
          Copy-Item '.\ffmpeg.exe' '.\dist\NovaShorts\ffmpeg.exe' -Force
          Copy-Item '.\ffprobe.exe' '.\dist\NovaShorts\ffprobe.exe' -Force
          Copy-Item '.\browser-extension' '.\dist\NovaShorts\browser-extension' -Recurse -Force
          Copy-Item '.\assets' '.\dist\NovaShorts\assets' -Recurse -Force
          if (Test-Path 'C:\Program Files\Tesseract-OCR') {
            Copy-Item 'C:\Program Files\Tesseract-OCR' '.\dist\NovaShorts\tesseract' -Recurse -Force
          }
          $td = '.\dist\NovaShorts\tesseract\tessdata'
          New-Item -ItemType Directory -Force -Path $td | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/kor.traineddata' -OutFile "$td\kor.traineddata"
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata' -OutFile "$td\chi_sim.traineddata"
          @'
          @echo off
          cd /d "%~dp0"
          start "" "NovaShorts.exe"
          '@ | Set-Content '.\dist\NovaShorts\START_NovaShorts.bat' -Encoding ASCII
          @'
          NovaShorts v1.13
          1. NovaShorts.exe 또는 START_NovaShorts.bat 실행
          2. 홈의 대형 배너를 제거해 소싱 결과와 작업 영역이 아래로 밀리지 않도록 수정했습니다.
          3. TikTok, YouTube, Instagram, Douyin, Xiaohongshu, Kuaishou, 1688 플랫폼 아이콘+이름 UI는 유지합니다.
          4. 빠른 설정의 AI 모델/TTS/해상도 라벨과 콤보박스를 고정 높이로 분리해 겹침과 잘림을 방지했습니다.
          5. 자막 제거/자동 컷/워터마크/업로드 후 링크 생성은 ON/OFF 단추 방식으로 변경했습니다.
          6. 설정 화면을 컴팩트한 스크롤 안전 레이아웃으로 재구성해 1600x930에서 모든 항목이 겹치지 않도록 수정했습니다.
          7. 좌측 메뉴 hover/active 테두리와 포인트를 강화했습니다.
          8. 설정에서 본인의 Gemini/Coupang/YouTube/Lnk.Bio 키를 입력하세요.
          '@ | Set-Content '.\dist\NovaShorts\사용방법.txt' -Encoding UTF8

      - name: Smoke test package
        shell: pwsh
        run: |
          if (!(Test-Path '.\dist\NovaShorts\NovaShorts.exe')) { throw 'NovaShorts.exe not created' }
          if (!(Test-Path '.\dist\NovaShorts\ffmpeg.exe')) { throw 'ffmpeg.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\ffprobe.exe')) { throw 'ffprobe.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\assets\platforms\tiktok.svg')) { throw 'platform icons missing' }
          if (!(Test-Path '.\dist\NovaShorts\tesseract\tesseract.exe')) { throw 'tesseract.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\tesseract\tessdata\kor.traineddata')) { throw 'kor OCR data missing' }
          if (!(Test-Path '.\dist\NovaShorts\tesseract\tessdata\chi_sim.traineddata')) { throw 'chi_sim OCR data missing' }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path '.\dist\NovaShorts\*' -DestinationPath '.\NovaShorts_v1.13.zip' -CompressionLevel Optimal -Force
          Get-FileHash '.\NovaShorts_v1.13.zip' -Algorithm SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaShorts_v1.13
          path: NovaShorts_v1.13.zip
          if-no-files-found: error
          retention-days: 30

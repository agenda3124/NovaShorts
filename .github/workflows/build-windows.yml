name: Build NovaShorts Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile engine.py engine_v112.py bridge.py features.py main_v18.py main_v19.py main_v112.py main_v113.py main_v114.py main_v115.py
          python -c "import main_v115, engine_v112; assert len(engine_v112.PLATFORMS)==7; print('import-ok', list(engine_v112.PLATFORMS))"

      - name: UI clipping and spacing smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          from PySide6.QtCore import QPoint, QRect
          from PySide6.QtWidgets import QApplication, QFrame, QLabel
          import main_v115

          app = QApplication([])
          w = main_v115.Nova()
          w.resize(1600, 930)
          w.show()
          app.processEvents()

          assert w.pages.count() == 8
          sidebar = w.findChild(QFrame, 'sidebar')
          assert sidebar is not None and sidebar.width() == 205
          ver = w.findChild(QLabel, 'version115')
          assert ver is not None and ver.text() == 'Version 1.15'

          quick = w.findChild(QFrame, 'quickCard115')
          assert quick is not None
          assert len(w.quick_field_pairs) == 3
          assert len(w.quick_toggle_pairs) == 4

          def rect_in(parent, child):
              p = child.mapTo(parent, QPoint(0, 0))
              return QRect(p, child.size())

          for lab, ctl in w.quick_field_pairs:
              assert lab.isVisible() and ctl.isVisible()
              assert lab.parent() is ctl.parent()
              assert not lab.geometry().intersects(ctl.geometry())
              assert quick.rect().contains(rect_in(quick, lab))
              assert quick.rect().contains(rect_in(quick, ctl))

          for lab, ctl in w.quick_toggle_pairs:
              assert lab.isVisible() and ctl.isVisible()
              assert lab.parent() is ctl.parent()
              assert not lab.geometry().intersects(ctl.geometry())
              assert ctl.text() in ('ON', 'OFF')
              assert quick.rect().contains(rect_in(quick, lab))
              assert quick.rect().contains(rect_in(quick, ctl))

          # Specifically verify the final quick-setting row is not clipped by preview.
          last_lab, last_ctl = w.quick_toggle_pairs[-1]
          assert rect_in(quick, last_lab).bottom() < quick.height()
          assert rect_in(quick, last_ctl).bottom() < quick.height()

          # Source page: keep visible air between the page heading and first group box.
          w.go(1)
          app.processEvents()
          page = w.pages.currentWidget()
          title = next(x for x in page.findChildren(QLabel) if x.text() == '글로벌 영상 소싱')
          group = w.product.parentWidget()
          title_bottom = title.mapTo(page, QPoint(0, 0)).y() + title.height()
          group_top = group.mapTo(page, QPoint(0, 0)).y()
          assert group_top - title_bottom >= 10

          # Settings page still constructs cleanly after the inherited v1.14 row fix.
          w.go(7)
          app.processEvents()
          assert len(w.setting_pairs) == 8
          for lab, ctl in w.setting_pairs:
              assert lab.isVisible() and ctl.isVisible()
              assert lab.parent() is ctl.parent()
              assert not lab.geometry().intersects(ctl.geometry())

          print('ui-v115-ok', w.windowTitle(), 'sidebar', sidebar.width(), 'quick-h', quick.height())
          w.close()
          '@ | Set-Content .\ui_test.py -Encoding UTF8
          python .\ui_test.py

      - name: Install FFmpeg and Tesseract
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          choco install tesseract --yes --no-progress

      - name: Locate runtime tools
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\tools\\'} | Select-Object -First 1
          $ffprobe = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter ffprobe.exe -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\tools\\'} | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found' }
          if (-not $ffprobe) { throw 'ffprobe.exe not found' }
          Copy-Item $ffmpeg.FullName '.\ffmpeg.exe' -Force
          Copy-Item $ffprobe.FullName '.\ffprobe.exe' -Force

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name NovaShorts --collect-all edge_tts --collect-all yt_dlp --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all PySide6.QtSvg --hidden-import googleapiclient.discovery --hidden-import googleapiclient.http --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets --hidden-import PySide6.QtNetwork --hidden-import PySide6.QtSvg main_v115.py
          Copy-Item '.\ffmpeg.exe' '.\dist\NovaShorts\ffmpeg.exe' -Force
          Copy-Item '.\ffprobe.exe' '.\dist\NovaShorts\ffprobe.exe' -Force
          Copy-Item '.\browser-extension' '.\dist\NovaShorts\browser-extension' -Recurse -Force
          Copy-Item '.\assets' '.\dist\NovaShorts\assets' -Recurse -Force
          Copy-Item '.\NovaShorts_사용설명서_v1.15.txt' '.\dist\NovaShorts\NovaShorts_사용설명서_v1.15.txt' -Force
          if (Test-Path 'C:\Program Files\Tesseract-OCR') {
            Copy-Item 'C:\Program Files\Tesseract-OCR' '.\dist\NovaShorts\tesseract' -Recurse -Force
          }
          $td = '.\dist\NovaShorts\tesseract\tessdata'
          New-Item -ItemType Directory -Force -Path $td | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/kor.traineddata' -OutFile "$td\kor.traineddata"
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata' -OutFile "$td\chi_sim.traineddata"
          @'
          @echo off
          cd /d "%~dp0"
          start "" "NovaShorts.exe"
          '@ | Set-Content '.\dist\NovaShorts\START_NovaShorts.bat' -Encoding ASCII
          @'
          NovaShorts v1.15
          - 상세 설명은 NovaShorts_사용설명서_v1.15.txt를 확인하세요.
          - 좌측 메뉴 폭 축소 및 버전 분리 표시
          - 빠른 설정 높이 자동 계산: 마지막 ON/OFF 행 잘림 방지
          - 상품/검색어 및 플랫폼 그룹 상단 여백 확대
          - Windows DPI/폰트 배율에서 겹침을 줄이도록 행 컨테이너 기반 배치
          '@ | Set-Content '.\dist\NovaShorts\사용방법.txt' -Encoding UTF8

      - name: Smoke test package
        shell: pwsh
        run: |
          if (!(Test-Path '.\dist\NovaShorts\NovaShorts.exe')) { throw 'NovaShorts.exe not created' }
          if (!(Test-Path '.\dist\NovaShorts\ffmpeg.exe')) { throw 'ffmpeg.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\ffprobe.exe')) { throw 'ffprobe.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\assets\platforms\tiktok.svg')) { throw 'platform icons missing' }
          if (!(Test-Path '.\dist\NovaShorts\tesseract\tesseract.exe')) { throw 'tesseract.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\tesseract\tessdata\kor.traineddata')) { throw 'kor OCR data missing' }
          if (!(Test-Path '.\dist\NovaShorts\tesseract\tessdata\chi_sim.traineddata')) { throw 'chi_sim OCR data missing' }
          if (!(Test-Path '.\dist\NovaShorts\NovaShorts_사용설명서_v1.15.txt')) { throw 'detailed manual missing' }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path '.\dist\NovaShorts\*' -DestinationPath '.\NovaShorts_v1.15.zip' -CompressionLevel Optimal -Force
          Get-FileHash '.\NovaShorts_v1.15.zip' -Algorithm SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaShorts_v1.15
          path: NovaShorts_v1.15.zip
          if-no-files-found: error
          retention-days: 30

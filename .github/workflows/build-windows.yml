name: Build NovaShorts Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile engine.py engine_v112.py bridge.py features.py main_v18.py main_v19.py main_v112.py main_v113.py main_v114.py
          python -c "import main_v114, engine_v112; assert len(engine_v112.PLATFORMS)==7; print('import-ok', list(engine_v112.PLATFORMS))"

      - name: UI geometry smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          from PySide6.QtWidgets import QApplication, QFrame, QLabel
          import main_v114
          app = QApplication([])
          w = main_v114.Nova()
          w.resize(1600, 930)
          w.show()
          app.processEvents()
          assert w.pages.count() == 8
          sidebar = w.findChild(QFrame, 'sidebar')
          assert sidebar is not None and sidebar.width() == 220
          ver = w.findChild(QLabel, 'version114')
          assert ver is not None and ver.text() == 'Version 1.14'
          assert len(w.quick_field_pairs) == 3
          assert len(w.quick_toggle_pairs) == 4
          for lab, ctl in w.quick_field_pairs:
              assert lab.isVisible() and ctl.isVisible()
              assert not lab.geometry().intersects(ctl.geometry())
              assert lab.height() >= 30 and ctl.height() >= 30
          for lab, ctl in w.quick_toggle_pairs:
              assert lab.isVisible() and ctl.isVisible()
              assert not lab.geometry().intersects(ctl.geometry())
              assert ctl.text() in ('ON', 'OFF')
          w.go(7)
          app.processEvents()
          assert len(w.setting_pairs) == 8
          for lab, ctl in w.setting_pairs:
              assert lab.isVisible() and ctl.isVisible()
              assert lab.parent() is ctl.parent()
              assert not lab.geometry().intersects(ctl.geometry())
          w.go(0)
          app.processEvents()
          assert w.findChild(QFrame, 'heroV112') is None
          print('ui-geometry-ok', w.windowTitle(), sidebar.width())
          w.close()
          '@ | Set-Content .\ui_test.py -Encoding UTF8
          python .\ui_test.py

      - name: Install FFmpeg and Tesseract
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          choco install tesseract --yes --no-progress

      - name: Locate runtime tools
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\tools\\'} | Select-Object -First 1
          $ffprobe = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter ffprobe.exe -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\tools\\'} | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found' }
          if (-not $ffprobe) { throw 'ffprobe.exe not found' }
          Copy-Item $ffmpeg.FullName '.\ffmpeg.exe' -Force
          Copy-Item $ffprobe.FullName '.\ffprobe.exe' -Force

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name NovaShorts --collect-all edge_tts --collect-all yt_dlp --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all PySide6.QtSvg --hidden-import googleapiclient.discovery --hidden-import googleapiclient.http --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets --hidden-import PySide6.QtNetwork --hidden-import PySide6.QtSvg main_v114.py
          Copy-Item '.\ffmpeg.exe' '.\dist\NovaShorts\ffmpeg.exe' -Force
          Copy-Item '.\ffprobe.exe' '.\dist\NovaShorts\ffprobe.exe' -Force
          Copy-Item '.\browser-extension' '.\dist\NovaShorts\browser-extension' -Recurse -Force
          Copy-Item '.\assets' '.\dist\NovaShorts\assets' -Recurse -Force
          if (Test-Path 'C:\Program Files\Tesseract-OCR') {
            Copy-Item 'C:\Program Files\Tesseract-OCR' '.\dist\NovaShorts\tesseract' -Recurse -Force
          }
          $td = '.\dist\NovaShorts\tesseract\tessdata'
          New-Item -ItemType Directory -Force -Path $td | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/kor.traineddata' -OutFile "$td\kor.traineddata"
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata' -OutFile "$td\chi_sim.traineddata"
          @'
          @echo off
          cd /d "%~dp0"
          start "" "NovaShorts.exe"
          '@ | Set-Content '.\dist\NovaShorts\START_NovaShorts.bat' -Encoding ASCII
          @'
          NovaShorts v1.14
          1. 좌측 메뉴 폭을 줄여 본문 작업 공간을 넓혔습니다.
          2. 버전은 NovaShorts 제목 아래 작은 별도 줄로 배치해 잘리지 않게 했습니다.
          3. 빠른 설정은 라벨/선택박스를 같은 행의 독립 컬럼으로 배치해 글자와 콤보박스가 겹치지 않도록 수정했습니다.
          4. 자막 제거/자동 컷/워터마크/업로드 후 링크 생성은 ON/OFF 단추형 토글을 유지합니다.
          5. 설정 화면도 각 입력 항목을 독립 행 컨테이너로 만들어 라벨과 입력창이 겹치지 않도록 했습니다.
          6. 작은 화면에서는 설정 화면이 세로 스크롤되며 항목이 잘리지 않습니다.
          7. 빌드 전에 실제 1600x930 UI geometry 검사로 빠른 설정/설정 화면의 겹침 여부를 자동 검증합니다.
          8. TikTok, YouTube, Instagram, Douyin, Xiaohongshu, Kuaishou, 1688 소싱 기능과 플랫폼 아이콘 UI는 유지합니다.
          '@ | Set-Content '.\dist\NovaShorts\사용방법.txt' -Encoding UTF8

      - name: Smoke test package
        shell: pwsh
        run: |
          if (!(Test-Path '.\dist\NovaShorts\NovaShorts.exe')) { throw 'NovaShorts.exe not created' }
          if (!(Test-Path '.\dist\NovaShorts\ffmpeg.exe')) { throw 'ffmpeg.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\ffprobe.exe')) { throw 'ffprobe.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\assets\platforms\tiktok.svg')) { throw 'platform icons missing' }
          if (!(Test-Path '.\dist\NovaShorts\tesseract\tesseract.exe')) { throw 'tesseract.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\tesseract\tessdata\kor.traineddata')) { throw 'kor OCR data missing' }
          if (!(Test-Path '.\dist\NovaShorts\tesseract\tessdata\chi_sim.traineddata')) { throw 'chi_sim OCR data missing' }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path '.\dist\NovaShorts\*' -DestinationPath '.\NovaShorts_v1.14.zip' -CompressionLevel Optimal -Force
          Get-FileHash '.\NovaShorts_v1.14.zip' -Algorithm SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaShorts_v1.14
          path: NovaShorts_v1.14.zip
          if-no-files-found: error
          retention-days: 30

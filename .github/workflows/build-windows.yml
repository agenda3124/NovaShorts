name: Build NovaShorts Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile engine.py engine_v112.py bridge.py features.py main_v18.py main_v19.py main_v112.py main_v113.py main_v114.py main_v115.py main_v116.py main_v117.py main_v118.py
          python -c "import main_v118, engine_v112; assert len(engine_v112.PLATFORMS)==7; print('import-ok')"

      - name: Responsive UI clipping smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          from PySide6.QtCore import QPoint, QRect
          from PySide6.QtWidgets import QApplication, QFrame, QScrollArea
          import main_v118

          app = QApplication([])
          w = main_v118.Nova()
          w.show()
          app.processEvents()

          assert w.pages.count() == 8
          assert 'v1.18' in w.windowTitle()
          assert 'v1.18' in w.status.text()
          assert hasattr(w, 'right_scroll118')
          assert isinstance(w.right_scroll118, QScrollArea)
          assert len(w.quick_field_pairs) == 3
          assert len(w.quick_toggle_pairs) == 4

          def rect_in(parent, child):
              p = child.mapTo(parent, QPoint(0, 0))
              return QRect(p, child.size())

          def check_quick():
              quick = w.findChild(QFrame, 'quickCard118')
              assert quick is not None
              assert quick.height() >= 370
              for lab, ctl in w.quick_field_pairs + w.quick_toggle_pairs:
                  assert lab.isVisible() and ctl.isVisible()
                  assert not lab.geometry().intersects(ctl.geometry())
                  assert quick.rect().contains(rect_in(quick, lab))
                  assert quick.rect().contains(rect_in(quick, ctl))

          # Desktop logical size.
          w.resize(1600, 930)
          app.processEvents()
          check_quick()
          assert w.right_scroll118.width() >= 350

          # Laptop / high-DPI logical size. Right side may scroll, but must never clip controls.
          w.resize(1280, 720)
          app.processEvents()
          check_quick()
          assert w.right_scroll118.width() <= 320
          assert w.queue_group118.height() <= 145

          # Settings inputs must be card rows with no black label slabs/overlap.
          w.go(7)
          app.processEvents()
          assert len(w.setting_pairs) == 8
          for lab, ctl in w.setting_pairs:
              assert lab.isVisible() and ctl.isVisible()
              assert not lab.geometry().intersects(ctl.geometry())
              parent = lab.parentWidget()
              assert parent is ctl.parentWidget()
              assert parent.rect().contains(rect_in(parent, lab))
              assert parent.rect().contains(rect_in(parent, ctl))
          css = w.styleSheet()
          assert 'settingRow118' in css and 'quickRow118' in css

          print('ui-v118-responsive-ok')
          w.close()
          '@ | Set-Content .\ui_test.py -Encoding UTF8
          python .\ui_test.py

      - name: Install FFmpeg and Tesseract
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          choco install tesseract --yes --no-progress

      - name: Locate runtime tools
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\tools\\'} | Select-Object -First 1
          $ffprobe = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter ffprobe.exe -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\tools\\'} | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found' }
          if (-not $ffprobe) { throw 'ffprobe.exe not found' }
          Copy-Item $ffmpeg.FullName '.\ffmpeg.exe' -Force
          Copy-Item $ffprobe.FullName '.\ffprobe.exe' -Force

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name NovaShorts --collect-all edge_tts --collect-all yt_dlp --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all PySide6.QtSvg --hidden-import googleapiclient.discovery --hidden-import googleapiclient.http --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets --hidden-import PySide6.QtNetwork --hidden-import PySide6.QtSvg main_v118.py
          Copy-Item '.\ffmpeg.exe' '.\dist\NovaShorts\ffmpeg.exe' -Force
          Copy-Item '.\ffprobe.exe' '.\dist\NovaShorts\ffprobe.exe' -Force
          Copy-Item '.\browser-extension' '.\dist\NovaShorts\browser-extension' -Recurse -Force
          Copy-Item '.\assets' '.\dist\NovaShorts\assets' -Recurse -Force
          Copy-Item '.\NovaShorts_사용설명서_v1.15.txt' '.\dist\NovaShorts\NovaShorts_사용설명서.txt' -Force
          if (Test-Path 'C:\Program Files\Tesseract-OCR') {
            Copy-Item 'C:\Program Files\Tesseract-OCR' '.\dist\NovaShorts\tesseract' -Recurse -Force
          }
          $td = '.\dist\NovaShorts\tesseract\tessdata'
          New-Item -ItemType Directory -Force -Path $td | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/kor.traineddata' -OutFile "$td\kor.traineddata"
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata' -OutFile "$td\chi_sim.traineddata"
          @'
          @echo off
          cd /d "%~dp0"
          start "" "NovaShorts.exe"
          '@ | Set-Content '.\dist\NovaShorts\START_NovaShorts.bat' -Encoding ASCII
          @'
          NovaShorts v1.18
          - 빠른 설정 전체를 세로 스크롤 대응형으로 변경해 노트북/데스크탑과 Windows 배율에서도 마지막 ON/OFF 행이 잘리지 않습니다.
          - 1600x930과 1280x720 논리 해상도에 맞춰 오른쪽 패널/왼쪽 메뉴/작업 대기열 폭과 높이를 자동 조절합니다.
          - 설정의 출력 폴더/API 키/연동 입력 행을 빠른 설정과 같은 네이비 카드 디자인으로 통일해 검은 배경 띠를 제거했습니다.
          - 설정 화면은 세로 스크롤을 사용해 작은 화면에서도 입력 항목이 겹치지 않습니다.
          - 자세한 기능 사용법은 NovaShorts_사용설명서.txt를 확인하세요.
          '@ | Set-Content '.\dist\NovaShorts\사용방법.txt' -Encoding UTF8

      - name: Smoke test package
        shell: pwsh
        run: |
          if (!(Test-Path '.\dist\NovaShorts\NovaShorts.exe')) { throw 'NovaShorts.exe not created' }
          if (!(Test-Path '.\dist\NovaShorts\ffmpeg.exe')) { throw 'ffmpeg.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\ffprobe.exe')) { throw 'ffprobe.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\assets\platforms\tiktok.svg')) { throw 'platform icons missing' }
          if (!(Test-Path '.\dist\NovaShorts\tesseract\tesseract.exe')) { throw 'tesseract.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\NovaShorts_사용설명서.txt')) { throw 'manual missing' }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path '.\dist\NovaShorts\*' -DestinationPath '.\NovaShorts_v1.18.zip' -CompressionLevel Optimal -Force
          Get-FileHash '.\NovaShorts_v1.18.zip' -Algorithm SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaShorts_v1.18
          path: NovaShorts_v1.18.zip
          if-no-files-found: error
          retention-days: 30

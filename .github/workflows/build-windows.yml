name: Build NovaShorts Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  HF_HUB_DISABLE_SYMLINKS_WARNING: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile engine.py engine_v112.py bridge.py browser_cdp.py product_source.py features.py pipeline_v120.py pipeline_v121.py main_v18.py main_v19.py main_v112.py main_v113.py main_v114.py main_v115.py main_v116.py main_v117.py main_v118.py main_v119.py main_v120.py main_v121.py
          python -c "import main_v121, pipeline_v121, browser_cdp, engine_v112, cv2, faster_whisper, websocket; assert len(engine_v112.PLATFORMS)==7; print('import-v121-ok')"

      - name: Product and pipeline regression
        shell: pwsh
        run: |
          @'
          from engine import Settings
          from product_source import parse_product_html, search_seed, score_candidate
          from pipeline_v120 import fallback_script, generate_publish_metadata
          from pipeline_v121 import run_processing_pipeline_v121, merge_source_videos
          import browser_cdp
          html = '''
          <html><head>
          <meta property="og:title" content="테스트브랜드 IRT6030 스마트 온도계 | 쿠팡">
          <meta property="og:image" content="https://img.example/p.jpg">
          <script type="application/ld+json">
          {"@context":"https://schema.org","@type":"Product","name":"테스트브랜드 IRT6030 스마트 온도계","brand":{"@type":"Brand","name":"테스트브랜드"},"model":"IRT6030","image":"https://img.example/p.jpg"}
          </script></head></html>
          '''
          p = parse_product_html(html, 'https://www.coupang.com/vp/products/123456')
          assert p['title'] == '테스트브랜드 IRT6030 스마트 온도계'
          assert p['brand'] == '테스트브랜드'
          assert p['model'] == 'IRT6030'
          assert p['product_id'] == '123456'
          assert 'IRT6030' in search_seed(p)
          s = score_candidate(p, {'title':'IRT6030 스마트 온도계 사용 영상','url':'https://example.com/v'}, check_image=False)
          assert s['_score'] >= 90
          st = Settings()
          assert st.pipeline_remove_subtitles and st.pipeline_auto_cut and st.pipeline_add_korean_subtitles
          script = fallback_script(p, '사용 장면 테스트')
          meta = generate_publish_metadata(p, script, '')
          assert len(script) > 30 and meta['title'] and meta['description'] and meta['tags']
          assert callable(run_processing_pipeline_v121) and callable(merge_source_videos)
          assert callable(browser_cdp.analyze_product_page) and callable(browser_cdp.collect_links) and callable(browser_cdp.extract_media)
          print('pipeline-v121-regression-ok')
          '@ | Set-Content .\pipeline_test.py -Encoding UTF8
          python .\pipeline_test.py

      - name: Browser and bridge regression
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          import browser_cdp
          assert browser_cdp.find_browser() is not None, 'Chrome/Edge should exist on windows-latest'
          m=json.loads(Path('browser-extension/manifest.json').read_text(encoding='utf-8'))
          hosts=' '.join(m['host_permissions'])
          for x in ['coupang.com','youtube.com','instagram.com','douyin.com','xiaohongshu.com','kuaishou.com','tiktok.com','1688.com']:
              assert x in hosts, x
          print('browser-fallback-v121-ok')
          '@ | Set-Content .\browser_test.py -Encoding UTF8
          python .\browser_test.py

      - name: Responsive UI and feature wiring smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          from PySide6.QtCore import QPoint, QRect
          from PySide6.QtWidgets import QApplication, QFrame, QScrollArea
          import main_v121

          app = QApplication([])
          w = main_v121.Nova()
          w.show(); app.processEvents()
          assert w.pages.count() == 8
          assert 'v1.21' in w.windowTitle()
          assert len(w.mode_buttons121) == 4
          assert w.mode_stack121.count() == 4
          assert w.home_make121.isVisible()
          assert hasattr(w, 'home_product_url121')
          assert hasattr(w, 'home_single_path121')
          assert hasattr(w, 'home_multi_list121')
          assert hasattr(w, 'home_ready_script121')
          assert hasattr(w, 'right_scroll118') and isinstance(w.right_scroll118, QScrollArea)

          for width,height in [(1600,930),(1440,900),(1280,720)]:
              w.resize(width,height); w.go(0); app.processEvents()
              assert w.home_make121.isVisible()
              for b in w.mode_buttons121: assert b.isVisible()
              w.go(1); app.processEvents()
              quick = w.findChild(QFrame, 'quickCard118')
              assert quick is not None and quick.isVisible()
              for lab, ctl in w.quick_field_pairs + w.quick_toggle_pairs:
                  assert lab.isVisible() and ctl.isVisible()
                  assert not lab.geometry().intersects(ctl.geometry())

          w.go(1); app.processEvents()
          assert len(w.pchecks) == 7
          assert w._start_pipeline_row120.__func__.__module__ == 'main_v121'
          assert w.bridge_collect.__func__.__module__ == 'main_v121'
          assert w.analyze_product_url119.__func__.__module__ == 'main_v121'

          w.go(7); app.processEvents()
          assert len(w.setting_pairs) == 8
          assert len(w.pipeline_setting_pairs120) == 7
          print('ui-feature-v121-ok')
          w.close()
          '@ | Set-Content .\ui_test.py -Encoding UTF8
          python .\ui_test.py

      - name: Acquire FFmpeg and ffprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          curl.exe -L --fail --retry 5 --retry-delay 3 --connect-timeout 20 $url -o '.\ffmpeg_bundle.zip'
          Expand-Archive '.\ffmpeg_bundle.zip' -DestinationPath '.\ffmpeg_bundle' -Force
          $ffmpeg = Get-ChildItem '.\ffmpeg_bundle' -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem '.\ffmpeg_bundle' -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found in downloaded bundle' }
          if (-not $ffprobe) { throw 'ffprobe.exe not found in downloaded bundle' }
          Copy-Item $ffmpeg.FullName '.\ffmpeg.exe' -Force
          Copy-Item $ffprobe.FullName '.\ffprobe.exe' -Force

      - name: Install Tesseract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ok = $false
          for ($i=1; $i -le 3; $i++) {
            choco install tesseract --yes --no-progress
            if (Test-Path 'C:\Program Files\Tesseract-OCR\tesseract.exe') { $ok = $true; break }
            Start-Sleep -Seconds (3 * $i)
          }
          if (-not $ok) { throw 'tesseract.exe not installed after retries' }

      - name: Bundle Whisper base model
        shell: pwsh
        run: |
          @'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          out=Path('models/whisper-base')
          out.mkdir(parents=True,exist_ok=True)
          snapshot_download('Systran/faster-whisper-base', local_dir=str(out), allow_patterns=['config.json','model.bin','tokenizer.json','vocabulary.*','preprocessor_config.json'])
          assert (out/'model.bin').exists(), 'Whisper model.bin missing'
          print('whisper-model-bundled')
          '@ | Set-Content .\download_model.py -Encoding UTF8
          python .\download_model.py

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name NovaShorts `
            --collect-all edge_tts --collect-all yt_dlp --collect-all googleapiclient --collect-all google_auth_oauthlib `
            --collect-all PySide6.QtSvg --collect-all PIL --collect-all faster_whisper --collect-all ctranslate2 `
            --collect-all av --collect-all tokenizers --collect-all cv2 --collect-all websocket `
            --hidden-import googleapiclient.discovery --hidden-import googleapiclient.http `
            --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets --hidden-import PySide6.QtNetwork --hidden-import PySide6.QtSvg `
            main_v121.py
          Copy-Item '.\ffmpeg.exe' '.\dist\NovaShorts\ffmpeg.exe' -Force
          Copy-Item '.\ffprobe.exe' '.\dist\NovaShorts\ffprobe.exe' -Force
          Copy-Item '.\browser-extension' '.\dist\NovaShorts\browser-extension' -Recurse -Force
          Copy-Item '.\assets' '.\dist\NovaShorts\assets' -Recurse -Force
          Copy-Item '.\models' '.\dist\NovaShorts\models' -Recurse -Force
          Copy-Item '.\NovaShorts_사용설명서_v1.21.txt' '.\dist\NovaShorts\NovaShorts_사용설명서.txt' -Force
          Copy-Item 'C:\Program Files\Tesseract-OCR' '.\dist\NovaShorts\tesseract' -Recurse -Force
          $td = '.\dist\NovaShorts\tesseract\tessdata'
          New-Item -ItemType Directory -Force -Path $td | Out-Null
          curl.exe -L --fail --retry 4 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/kor.traineddata' -o "$td\kor.traineddata"
          curl.exe -L --fail --retry 4 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata' -o "$td\chi_sim.traineddata"
          @'
          @echo off
          cd /d "%~dp0"
          start "" "NovaShorts.exe"
          '@ | Set-Content '.\dist\NovaShorts\START_NovaShorts.bat' -Encoding ASCII
          @'
          NovaShorts v1.21
          - 메인 화면을 상품 주소 / 영상 1개 / 여러 영상 / 준비한 자료의 4가지 제작 방식으로 전면 개편했습니다.
          - 목소리 / 자막 / 편집 설정은 필요한 항목만 펼쳐서 바꿉니다.
          - 상품 주소는 일반 요청이 403으로 막히면 Chrome/Edge CDP 브라우저를 자동 실행해 다시 분석합니다.
          - Chrome Bridge 토큰은 기본 사용에 필요하지 않으며 기존 확장 프로그램은 보조 폴백으로만 남겨두었습니다.
          - 여러 영상 병합, 준비 대본 사용, OCR, 스마트 자막 제거, Whisper, TTS, 자동 컷, 9:16 렌더, 한국어 자막, 썸네일을 실제 제작 파이프라인으로 연결했습니다.
          - 완성 영상은 메인 화면에서 바로 재생하거나 결과 폴더를 열 수 있습니다.
          '@ | Set-Content '.\dist\NovaShorts\사용방법.txt' -Encoding UTF8

      - name: Smoke test package
        shell: pwsh
        run: |
          $required = @(
            '.\dist\NovaShorts\NovaShorts.exe',
            '.\dist\NovaShorts\ffmpeg.exe',
            '.\dist\NovaShorts\ffprobe.exe',
            '.\dist\NovaShorts\tesseract\tesseract.exe',
            '.\dist\NovaShorts\tesseract\tessdata\kor.traineddata',
            '.\dist\NovaShorts\tesseract\tessdata\chi_sim.traineddata',
            '.\dist\NovaShorts\models\whisper-base\model.bin',
            '.\dist\NovaShorts\browser-extension\service_worker.js',
            '.\dist\NovaShorts\NovaShorts_사용설명서.txt'
          )
          foreach($p in $required){ if(!(Test-Path $p)){ throw "package missing: $p" } }
          Get-ChildItem '.\dist\NovaShorts' | Select-Object -First 20

      - name: Upload direct package
        uses: actions/upload-artifact@v4
        with:
          name: NovaShorts_v1.21_DIRECT
          path: dist/NovaShorts/*
          if-no-files-found: error
          retention-days: 30

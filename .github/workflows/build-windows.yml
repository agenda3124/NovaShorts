name: Build NovaShorts Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Syntax and import check
        shell: pwsh
        run: |
          python -m py_compile engine.py engine_v112.py bridge.py features.py main_v18.py main_v19.py main_v112.py main_v113.py main_v114.py main_v115.py main_v116.py main_v117.py
          python -c "import main_v117, engine_v112; assert len(engine_v112.PLATFORMS)==7; print('import-ok')"

      - name: UI spacing and clipping smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          from PySide6.QtCore import QPoint, QRect
          from PySide6.QtWidgets import QApplication, QFrame, QToolButton
          import main_v117

          app = QApplication([])
          w = main_v117.Nova()
          w.resize(1600, 930)
          w.show()
          app.processEvents()
          assert w.pages.count() == 8
          assert 'v1.17' in w.windowTitle()
          assert 'v1.17' in w.status.text()

          def rect_in(parent, child):
              p = child.mapTo(parent, QPoint(0, 0))
              return QRect(p, child.size())

          quick = w.findChild(QFrame, 'quickCard117')
          assert quick is not None
          assert quick.height() >= 374
          assert len(w.quick_field_pairs) == 3
          assert len(w.quick_toggle_pairs) == 4
          for lab, ctl in w.quick_field_pairs + w.quick_toggle_pairs:
              assert lab.isVisible() and ctl.isVisible()
              assert not lab.geometry().intersects(ctl.geometry())
              assert quick.rect().contains(rect_in(quick, lab))
              assert quick.rect().contains(rect_in(quick, ctl))
          assert all(x.text() in ('ON','OFF') for _,x in w.quick_toggle_pairs)
          assert 'QWidget[quickRow117="true"]' in w.styleSheet()

          w.go(1)
          app.processEvents()
          product_card = w.findChild(QFrame, 'sourceSection117')
          platform_card = w.findChild(QFrame, 'platformSection117')
          assert product_card is not None and platform_card is not None
          assert product_card.height() >= 166
          pr = rect_in(product_card, w.product)
          ur = rect_in(product_card, w.product_url)
          assert ur.top() - pr.bottom() >= 8
          assert product_card.rect().contains(pr)
          assert product_card.rect().contains(ur)
          assert w.product.height() == 42
          assert w.product_url.height() == 42
          assert product_card.rect().contains(rect_in(product_card, w.source_row_product))
          assert product_card.rect().contains(rect_in(product_card, w.source_row_url))
          chips = platform_card.findChildren(QToolButton)
          assert len(chips) == 7
          for chip in chips:
              assert platform_card.rect().contains(rect_in(platform_card, chip))
              assert chip.height() == 38

          w.go(7)
          app.processEvents()
          for lab, ctl in w.setting_pairs:
              assert lab.isVisible() and ctl.isVisible()
              assert not lab.geometry().intersects(ctl.geometry())

          print('ui-v117-ok')
          w.close()
          '@ | Set-Content .\ui_test.py -Encoding UTF8
          python .\ui_test.py

      - name: Install FFmpeg and Tesseract
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          choco install tesseract --yes --no-progress

      - name: Locate runtime tools
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\tools\\'} | Select-Object -First 1
          $ffprobe = Get-ChildItem 'C:\ProgramData\chocolatey\lib' -Recurse -Filter ffprobe.exe -ErrorAction SilentlyContinue | Where-Object {$_.FullName -match '\\tools\\'} | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe not found' }
          if (-not $ffprobe) { throw 'ffprobe.exe not found' }
          Copy-Item $ffmpeg.FullName '.\ffmpeg.exe' -Force
          Copy-Item $ffprobe.FullName '.\ffprobe.exe' -Force

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name NovaShorts --collect-all edge_tts --collect-all yt_dlp --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all PySide6.QtSvg --hidden-import googleapiclient.discovery --hidden-import googleapiclient.http --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets --hidden-import PySide6.QtNetwork --hidden-import PySide6.QtSvg main_v117.py
          Copy-Item '.\ffmpeg.exe' '.\dist\NovaShorts\ffmpeg.exe' -Force
          Copy-Item '.\ffprobe.exe' '.\dist\NovaShorts\ffprobe.exe' -Force
          Copy-Item '.\browser-extension' '.\dist\NovaShorts\browser-extension' -Recurse -Force
          Copy-Item '.\assets' '.\dist\NovaShorts\assets' -Recurse -Force
          Copy-Item '.\NovaShorts_사용설명서_v1.15.txt' '.\dist\NovaShorts\NovaShorts_사용설명서.txt' -Force
          if (Test-Path 'C:\Program Files\Tesseract-OCR') {
            Copy-Item 'C:\Program Files\Tesseract-OCR' '.\dist\NovaShorts\tesseract' -Recurse -Force
          }
          $td = '.\dist\NovaShorts\tesseract\tessdata'
          New-Item -ItemType Directory -Force -Path $td | Out-Null
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/kor.traineddata' -OutFile "$td\kor.traineddata"
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/chi_sim.traineddata' -OutFile "$td\chi_sim.traineddata"
          @'
          @echo off
          cd /d "%~dp0"
          start "" "NovaShorts.exe"
          '@ | Set-Content '.\dist\NovaShorts\START_NovaShorts.bat' -Encoding ASCII
          @'
          NovaShorts v1.17
          - 빠른 설정 카드 높이를 넉넉하게 늘리고 DPI 배율에서도 마지막 행이 잘리지 않게 변경했습니다.
          - AI 모델/TTS/해상도/토글 행 배경을 전체 디자인과 맞는 네이비 카드형 스타일로 통일했습니다.
          - 상품명과 쿠팡/상품 URL을 고정 높이의 독립 행 위젯으로 분리했습니다.
          - 상품 입력 카드의 고정 높이를 제거하고 최소 크기 기반으로 늘어나게 해 하단 테두리 잘림을 방지했습니다.
          - 플랫폼 버튼 높이와 카드 여백도 다시 확보했습니다.
          - 자세한 기능 사용법은 NovaShorts_사용설명서.txt를 확인하세요.
          '@ | Set-Content '.\dist\NovaShorts\사용방법.txt' -Encoding UTF8

      - name: Smoke test package
        shell: pwsh
        run: |
          if (!(Test-Path '.\dist\NovaShorts\NovaShorts.exe')) { throw 'NovaShorts.exe not created' }
          if (!(Test-Path '.\dist\NovaShorts\ffmpeg.exe')) { throw 'ffmpeg.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\ffprobe.exe')) { throw 'ffprobe.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\assets\platforms\tiktok.svg')) { throw 'platform icons missing' }
          if (!(Test-Path '.\dist\NovaShorts\tesseract\tesseract.exe')) { throw 'tesseract.exe missing' }
          if (!(Test-Path '.\dist\NovaShorts\NovaShorts_사용설명서.txt')) { throw 'manual missing' }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path '.\dist\NovaShorts\*' -DestinationPath '.\NovaShorts_v1.17.zip' -CompressionLevel Optimal -Force
          Get-FileHash '.\NovaShorts_v1.17.zip' -Algorithm SHA256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaShorts_v1.17
          path: NovaShorts_v1.17.zip
          if-no-files-found: error
          retention-days: 30

name: Capture NovaShorts UI

on:
  push:
    branches: [ main ]
    paths:
      - 'capture_ui_v122.py'
      - '.github/workflows/capture-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Capture actual v1.22 UI
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python capture_ui_v122.py
          if (!(Test-Path '.\NovaShorts_v1.22_ACTUAL_UI.png')) { throw 'screenshot missing' }

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: NovaShorts_v1.22_ACTUAL_UI
          path: NovaShorts_v1.22_ACTUAL_UI.png
          if-no-files-found: error
          retention-days: 30

      - name: Commit actual screenshot to repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.\docs' | Out-Null
          Copy-Item '.\NovaShorts_v1.22_ACTUAL_UI.png' '.\docs\NovaShorts_v1.22_ACTUAL_UI.png' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '.\docs\NovaShorts_v1.22_ACTUAL_UI.png'
          if (git diff --cached --quiet) { Write-Host 'No screenshot changes' } else { git commit -m 'Add actual NovaShorts v1.22 UI screenshot'; git push }
